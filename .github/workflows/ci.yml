name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Aether has no runtime dependencies by design, so only the test runner
      # is installed here. If this step ever grows, ADR 0001 needs revisiting.
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Verify the package really has no runtime dependencies
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import aether.cli, aether.mcp.server, aether.eval.harness; print('imports clean')"

      - name: Run tests
        run: python -m pytest -q

      - name: Run the Phase 0 gate demonstration
        run: python examples/demo_phase0.py

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      # A README that overstates the suite is a bad first impression, and the
      # number drifts silently every time a test is added. Fail instead.
      - name: README test count must match the suite
        run: |
          claimed=$(grep -oE '# [0-9]+ tests' README.md | head -1 | grep -oE '[0-9]+')
          actual=$(python -m pytest -o addopts= --collect-only -q | grep -c '::')
          echo "README claims ${claimed}, suite collects ${actual}"
          if [ "$claimed" != "$actual" ]; then
            echo "::error::README says ${claimed} tests but the suite has ${actual}"
            exit 1
          fi

      # A native gcc here would emit an ELF and the demo would correctly skip
      # its PE checks - reporting 24/24 rather than the full 25. Installing a
      # mingw cross-compiler makes this the one job that exercises the PE path
      # end to end, and lets the README's headline number be checked honestly.
      - name: Install a PE cross-compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build every sample, including a real PE
        run: |
          python examples/src/build_elf_sample.py examples/firmware_agent.elf
          x86_64-w64-mingw32-gcc -O0 -g0 -o examples/vulnerable_demo.exe             examples/src/vulnerable_demo.c
          python examples/src/build_firmware_sample.py examples/demo_firmware.bin
          test "$(head -c2 examples/vulnerable_demo.exe)" = "MZ"
          echo "PE sample is a real PE"

      # The demo is the headline claim on the README; if the gate count moves,
      # the README has to move with it.
      - name: README gate count must match the demonstration
        run: |
          actual=$(python examples/demo_phase0.py | grep -oE '[0-9]+/[0-9]+ gate checks passed' | grep -oE '^[0-9]+')
          claimed=$(grep -oE 'All [0-9]+ gate checks pass' README.md | grep -oE '[0-9]+')
          echo "README claims ${claimed}, demo reports ${actual}"
          if [ "$claimed" != "$actual" ]; then
            echo "::error::README says ${claimed} gate checks but the demo reports ${actual}"
            exit 1
          fi

      - name: Run the suite with real PE coverage
        run: python -m pytest -q

  determinism:
    name: export determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Git-friendly export is only useful if it is reproducible. This
      # builds two projects from scratch and fails if their graph digests
      # differ, which is the property the whole export format exists for.
      - name: Two independent analyses must produce identical graphs
        run: |
          python examples/src/build_elf_sample.py examples/firmware_agent.elf
          python cli/aether.py init ./run-a --name determinism
          python cli/aether.py -P ./run-a analyze examples/firmware_agent.elf --path bin/agent
          python cli/aether.py -P ./run-a --json export ./out-a > /dev/null
          python cli/aether.py init ./run-b --name determinism
          python cli/aether.py -P ./run-b analyze examples/firmware_agent.elf --path bin/agent
          python cli/aether.py -P ./run-b --json export ./out-b > /dev/null
          diff -r ./out-a/graph ./out-b/graph
          echo "graph/ is byte-identical across independent analyses"

  evaluation:
    name: ground-truth evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sample binaries are generated rather than committed, and `aether eval`
      # deliberately does not build them for you - it points at the generators
      # instead. So build them explicitly here.
      - name: Build the evaluation targets
        run: |
          python examples/src/build_elf_sample.py examples/firmware_agent.elf
          python examples/src/build_firmware_sample.py examples/demo_firmware.bin

      - name: Score claims against ground truth
        run: python cli/aether.py eval
