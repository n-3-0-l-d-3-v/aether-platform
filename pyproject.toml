[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "Evidence-first binary and firmware analysis platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# No runtime dependencies, deliberately. Aether is local-first and its value is
# the project model; a zero-dependency core means the CLI and the MCP server
# run anywhere Python does, including inside constrained analysis environments.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.setuptools.package-data]
"aether.adapters.ghidra" = ["scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
